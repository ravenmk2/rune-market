<style>

[data-theme=dark]{color-scheme:dark;--paper:#1a1918;--surface:#1f1e1d;--soft:#262624;--ink:#faf9f5;--text:#dedcd1;--muted:#b0aea5;--line:#3d3d3a;--clay:#e8a087;--clay-bg:#372720;--blue:#a2bdd3;--blue-bg:#26343f;--hover:#262624;--focus:#a2bdd3}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--sans)}button,input,select{font:inherit}button,select{cursor:pointer}button,a,input,select{outline-offset:5px} :focus-visible{outline:2px solid var(--focus)}a{color:inherit;text-decoration:none}button{color:inherit}svg{display:block}button{border:0}header{border-bottom:1px solid var(--line)}.wrap{max-width:1160px;margin:auto;padding:0 32px}.nav{min-height:80px;display:flex;align-items:center;gap:44px}.brand{display:flex;gap:10px;align-items:center;font:600 25px var(--serif);letter-spacing:-.8px}.rune{font:25px var(--serif)}.links{display:flex;gap:26px;font-size:14px}.links span{color:var(--muted)}.nav-right{margin-left:auto;display:flex;gap:18px;align-items:center}.theme{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px}.button{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:9px 17px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:550}.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}.hero{padding:68px 0 46px;display:grid;grid-template-columns:1fr 200px;gap:32px;align-items:center}.eyebrow{font:11px/1.5 var(--sans);letter-spacing:2px;color:var(--muted);margin-bottom:20px}.hero h1{font:400 clamp(32px,4.2vw,49px)/1.35 var(--serif);letter-spacing:-1px;margin:0}.hero h1 em{font-style:normal;color:var(--clay)}.hero p{color:var(--muted);margin:18px 0 25px;font-size:15px}.search{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:12px 16px;max-width:610px;background:var(--surface)}.search input{width:100%;background:none;border:0;color:var(--ink);min-width:0;outline:none}.search:focus-within{outline:2px solid var(--focus);outline-offset:3px}.search svg{color:var(--muted);flex-shrink:0}.hero-art{width:178px;height:178px;position:relative;color:var(--clay);display:grid;place-items:center}.hero-art svg{width:150px;height:150px}.hero-art:before{content:'';position:absolute;inset:7px;border:1px solid var(--line);border-radius:50%}.tabs{display:flex;gap:32px;border-bottom:1px solid var(--line)}.tab{background:transparent;color:var(--muted);padding:15px 0;position:relative;font-size:16px}.tab[aria-selected=true]{color:var(--ink)}.tab[aria-selected=true]:after{position:absolute;content:'';height:2px;bottom:-1px;left:0;right:0;background:var(--ink)}.count{font-size:11px;color:var(--muted);margin-left:7px}.filters{display:flex;gap:8px;align-items:center;padding:24px 0;flex-wrap:wrap}.chip{padding:5px 13px;background:transparent;border-radius:5px;font-size:13px;color:var(--muted)}.chip[aria-pressed=true]{background:var(--soft);color:var(--ink)}.filter-label{color:var(--muted);font-size:12px;margin-right:8px}.result{margin-left:auto;font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:238px;display:flex;flex-direction:column;transition:background .18s,border-color .18s}.card:hover{background:var(--hover);border-color:var(--muted)}.card-head{display:flex;gap:13px;align-items:center}.skill-icon{width:44px;height:44px;border-radius:10px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;flex-shrink:0}.skill-icon svg{width:38px;height:38px}.warm{background:var(--clay-bg);color:var(--clay)}.card h2{font-size:16px;line-height:1.4;margin:0;font-weight:600;overflow-wrap:anywhere}.owner{font-size:12px;color:var(--muted);margin-top:4px}.official{color:var(--clay);font-size:11px;margin-left:6px}.desc{font-size:14px;line-height:1.8;color:var(--text);margin:18px 0 22px}.card-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);margin-top:auto}.downloads{font-variant-numeric:tabular-nums}.empty{padding:40px;text-align:center;grid-column:1/-1;color:var(--muted)}.review{margin:48px 0 56px;border-top:1px solid var(--line);padding-top:25px;display:grid;grid-template-columns:1fr 1.2fr;gap:35px}.review h2{font-size:17px;font-weight:500;margin:0 0 8px}.review p{font-size:13px;color:var(--muted);margin:0;max-width:420px}.comparison{display:flex;gap:12px}.sample{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px;flex:1}.sample b{font-size:13px;font-weight:500}.sample small{font-size:11px;color:var(--muted);display:block}.sample.recommended{background:var(--surface)}footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer-inner{padding-top:22px;padding-bottom:22px;display:flex;justify-content:space-between;gap:20px}.design-icon{font:25px var(--serif);color:var(--clay);background:var(--clay-bg)}.preview-note{font-size:10px;letter-spacing:1px}.icon-mode{margin-top:14px;color:var(--blue);background:transparent;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:4px}.login{font-size:13px;color:var(--muted)}
@media(max-width:850px){.nav{gap:24px}.links{display:none}.hero{grid-template-columns:1fr}.hero-art{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.review{grid-template-columns:1fr}.hero{padding-top:45px}}
@media(max-width:560px){.wrap{padding-left:20px;padding-right:20px}.nav{min-height:72px;flex-wrap:wrap;gap:12px;padding-top:14px;padding-bottom:14px}.brand{font-size:22px}.nav-right{gap:10px}.login,.publish{display:none}.theme{max-width:110px}.hero{padding:36px 0 30px}.hero h1{font-size:33px}.hero p{font-size:14px}.grid{grid-template-columns:1fr}.result{width:100%;margin-top:7px}.comparison{flex-direction:column}.card{min-height:220px}.footer-inner{flex-direction:column;gap:6px}.tabs{gap:24px}}

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><symbol id="skill" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 12H16a3 3 0 0 0-3 3v18a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V23"/><path d="M19 23h7M19 29h10M33 9l1.4 3.6L38 14l-3.6 1.4L33 19l-1.4-3.6L28 14l3.6-1.4L33 9Z"/></g></symbol></svg>
<header><div class="wrap nav"><a href="#" class="brand"><span class="rune">ᚱ</span> RuneMarket</a><nav class="links" aria-label="主导航"><a href="#market">浏览制品</a><span>发布</span></nav><div class="nav-right"><label><span hidden>显示主题</span><select class="theme" id="theme" aria-label="显示主题"><option value="system">跟随系统</option><option value="light">浅色主题</option><option value="dark">深色主题</option></select></label><span class="login">登录</span><span class="button publish">发布制品 ↗</span></div></div></header>
<main class="wrap"><section class="hero"><div><div class="eyebrow">BUILT TO BE SHARED</div><h1>让好方法，<wbr>成为下一次<em>创造</em>的起点。</h1><p>发现实用的智能体技能与设计系统，让好方法触手可及。</p><div class="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="搜索示例制品" placeholder="搜索技能、设计系统或关键词…"></div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m80 17 54 31v64l-54 31-54-31V48Zm0 0v63m54-32L80 80l-54-32m54 32v63M26 112l54-32 54 32M53 32v64l54 32M107 32v64l-54 32"/><circle cx="80" cy="80" r="12" fill="var(--paper)"/></svg></div></section>
<section id="market" aria-label="制品市场"><div class="tabs" role="tablist" aria-label="制品类型"><button class="tab" id="skills-tab" role="tab" aria-selected="true" aria-controls="items" data-type="skills">Skills <span class="count">06</span></button><button class="tab" id="designs-tab" role="tab" aria-selected="false" aria-controls="items" tabindex="-1" data-type="designs">DESIGN.md <span class="count">03</span></button></div><div class="filters"><span class="filter-label">探索</span><button class="chip" data-tag="全部" aria-pressed="true">全部</button><button class="chip" data-tag="开发" aria-pressed="false">开发</button><button class="chip" data-tag="设计" aria-pressed="false">设计</button><button class="chip" data-tag="效率" aria-pressed="false">效率</button><button class="chip" data-tag="文档" aria-pressed="false">文档</button><span class="result" id="result" role="status"></span></div><div class="grid" id="items" role="tabpanel" aria-labelledby="skills-tab"></div></section>
<section class="review" aria-label="默认图标配色对比"><div><div class="eyebrow">DESIGN NOTE / 01</div><h2>技能用石板蓝，强调色留给陶土。</h2><p>保留现有「文档 + 星芒」图形，只调整默认图标配色。冷色标识技能，暖色标识品牌与重点，两者在米白和暖黑背景下都保持克制。</p><button class="icon-mode" id="icon-mode" aria-pressed="false">对比：将上方技能图标切换为陶土色</button></div><div class="comparison"><div class="sample warm-sample"><div class="skill-icon warm"><svg aria-hidden="true"><use href="#skill"/></svg></div><div><b>陶土色</b><small>与品牌强调色接近</small></div></div><div class="sample recommended"><div class="skill-icon"><svg aria-hidden="true"><use href="#skill"/></svg></div><div><b>石板蓝 · 建议</b><small>技能标识更清晰</small></div></div></div></section></main>
<footer><div class="wrap footer-inner"><span>ᚱ RuneMarket　·　让经验成为可复用的能力。</span><span class="preview-note">静态样式提案 · 示例数据 · 非正式页面</span></div></footer>
<script>
const items={skills:[['frontend-design','设计高质量的前端界面，从页面布局到精细的组件交互。','设计','raven','2.4k'],['code-review','系统检查代码质量与潜在缺陷，给出清晰、可执行的改进建议。','开发','runemarket','1.8k'],['pdf-toolkit','提取、整理与生成 PDF，让复杂文档处理成为简单的一步。','文档','runemarket','986'],['go-project-init','从项目结构到工程工具，建立一致、可靠的 Go 开发起点。','开发','raven','754'],['writing-assistant','梳理思路、组织内容，把草稿打磨成准确自然的表达。','文档','lin','621'],['workflow-builder','连接日常重复任务，构建可以复用和持续改进的工作流。','效率','chen','508']],designs:[['Editorial Warmth','纸张质感、温暖中性色与编辑式排版，为内容产品建立清晰秩序。','设计','raven','842'],['Quiet Workspace','为专注而设计的工作界面，包含明暗主题和完整的组件规范。','设计','lin','613'],['Developer Notes','面向开发者的文档系统，兼顾长文阅读、代码展示与信息检索。','文档','chen','426']]};let type='skills',tag='全部',warm=false;const media=matchMedia('(prefers-color-scheme: dark)'),theme=document.querySelector('#theme');try{theme.value=localStorage.getItem('rm-prototype-theme')||'system'}catch{}if(!theme.value)theme.value='system';function applyTheme(){document.documentElement.dataset.theme=theme.value==='system'?(media.matches?'dark':'light'):theme.value}theme.addEventListener('change',()=>{applyTheme();try{localStorage.setItem('rm-prototype-theme',theme.value)}catch{}});media.addEventListener('change',applyTheme);applyTheme();
function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const rows=items[type].filter(x=>(tag==='全部'||x[2]===tag)&&x.join(' ').toLowerCase().includes(q));document.querySelector('#result').textContent=`${rows.length} 个示例制品`;document.querySelector('#items').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="card-head"><div class="skill-icon ${type==='designs'?'design-icon':warm?'warm':''}">${type==='designs'?'Aa':'<svg aria-hidden="true"><use href="#skill"/></svg>'}</div><div><h2>${x[0]}</h2><div class="owner">${x[3]} / v1.2.0 ${x[3]==='runemarket'?'<span class="official">✦ 官方</span>':''}</div></div></div><p class="desc">${x[1]}</p><div class="card-foot"><span>${x[2]} · ${type==='skills'?'Agent Skill':'Design System'}</span><span class="downloads">↓ ${x[4]}</span></div></article>`).join(''):'<p class="empty">没有匹配的示例制品，请尝试其他关键词。</p>'}
document.querySelectorAll('[data-type]').forEach(b=>{b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(t=>{t.setAttribute('aria-selected',String(t===b));t.tabIndex=t===b?0:-1});document.querySelector('#items').setAttribute('aria-labelledby',b.id);render()};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[data-type]')],next=e.key==='Home'?tabs[0]:e.key==='End'?tabs[1]:tabs.find(t=>t!==b);next.focus();next.click()}}});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{tag=b.dataset.tag;document.querySelectorAll('[data-tag]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));render()});document.querySelector('#search').oninput=render;document.querySelector('#icon-mode').onclick=e=>{warm=!warm;e.currentTarget.setAttribute('aria-pressed',String(warm));e.currentTarget.textContent=warm?'对比：将上方技能图标切换为石板蓝':'对比：将上方技能图标切换为陶土色';render()};render();
</script>
