name: docker-dev

on:
  push:
    branches: [master, main, dev, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create web/dist placeholder for //go:embed
        run: mkdir -p web/dist && touch web/dist/index.html
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Create web/dist placeholder for //go:embed
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: go vet
        run: go vet ./...
        env:
          CGO_ENABLED: 0
      - name: go test
        run: go test ./...
        env:
          CGO_ENABLED: 0

  docker:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute version
        id: ver
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ravenmk2/rune-market:dev
          build-args: VERSION=${{ steps.ver.outputs.value }}
